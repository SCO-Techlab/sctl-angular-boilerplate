@if (showDialog) {
  <sctl-dialog 
    [visible]="showDialog" 
    [config]="dialogConfig" 
    (close)="onClose()" 
    (submit)="onSubmit($event)"
  >
    <div content>
      <div class="w-full flex justify-end items-center">
        <p-button
          [label]="'COMMON.DELETE' | translate"
          [severity]="'danger'"
          [outlined]="true"
          [rounded]="true"
          [icon]="'pi pi-trash'"
          (onClick)="onDelete()"
        ></p-button>
      </div>

      <form [formGroup]="form">
        <div class="flex flex-col md:flex-row gap-0 md:gap-8">
          <div class="mb-6 w-full">
            <label for="booking-form-dialog-customer" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              {{ 'PAGES.BOOKINGS.COLS.CUSTOMER' | translate }}
            </label>
            <p-select
              [appendTo]="'body'"
              [className]="'w-full'"
              [inputId]="'booking-form-dialog-customer'"
              [options]="customerOptions" 
              formControlName="customer" 
              [optionLabel]="'label'"
              [optionValue]="'value'"
              class="w-full md:w-56" 
              [showClear]="true"
            />
          </div>
        </div>

        <div class="flex flex-col md:flex-row gap-0 md:gap-8">
          <div class="mb-6 w-full">
            <label for="booking-form-dialog-rooms" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              {{ 'PAGES.BOOKINGS.COLS.ROOM' | translate }}
            </label>
            <sctl-room-selector
              [rooms]="rooms() ?? []"
              [value]="form.get('rooms')?.value ?? []"
              [label]="'PAGES.BOOKINGS.COLS.ROOM' | translate"
              (valueChange)="onRoomsChange($event)"
            ></sctl-room-selector>
          </div>
        </div>

        <hr class="pb-4">

        <div class="flex flex-col md:flex-row gap-0 md:gap-8">
          <div class="mb-6 w-full">
            <label for="booking-form-dialog-start" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              {{ 'PAGES.BOOKINGS.COLS.START' | translate }}
            </label>
            <p-datepicker
              [appendTo]="'body'"
              [className]="'w-full'"
              [inputId]="'booking-form-dialog-start'"
              formControlName="start"
              class="w-full"
              [showIcon]="true"
              [inputStyle]="{'width': '100%'}"
              [showTime]="true"
            ></p-datepicker>
          </div>
        </div>

        <div class="flex flex-col md:flex-row gap-0 md:gap-8">
          <div class="mb-6 w-full">
            <label for="booking-form-dialog-end" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              {{ 'PAGES.BOOKINGS.COLS.END' | translate }}
            </label>
            <p-datepicker
              [appendTo]="'body'"
              [className]="'w-full'"
              [inputId]="'booking-form-dialog-end'"
              formControlName="end"
              class="w-full"
              [showIcon]="true"
              [inputStyle]="{'width': '100%'}"
              [showTime]="true" 
            ></p-datepicker>
          </div>
        </div>

        <div class="flex flex-col md:flex-row gap-0 md:gap-8">
          <div class="mb-6 w-full">
            <label for="booking-form-dialog-comment" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              {{ 'PAGES.BOOKINGS.COLS.COMMENT' | translate }}
            </label>
           <textarea
              pTextarea
              id="booking-form-dialog-comment"
              formControlName="comment"
              class="w-full"
              rows="5"
              [autoResize]="true"
            ></textarea>
          </div>
        </div>
      </form>
    </div>
  </sctl-dialog>
}
