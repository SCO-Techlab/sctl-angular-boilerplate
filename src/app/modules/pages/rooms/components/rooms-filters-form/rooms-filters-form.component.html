<form class="contents" filtersForm [formGroup]="form">
  <div>
    <label for="rooms-name-filter" class="block text-surface-900 dark:text-surface-0 text-md font-medium mb-2">
      {{ 'ROOMS.COLS.NAME' | translate }}
    </label>
    <input pInputText class="w-full"
      id="rooms-name-filter"
      type="text"
      [formControlName]="'name'"
    />
  </div>

  <div>
    <label for="rooms-beds-filter" class="block text-surface-900 dark:text-surface-0 text-md font-medium mb-2">
      {{ 'ROOMS.COLS.BEDS' | translate }}
    </label>
    <p-inputnumber class="w-full"
      inputId="rooms-beds-filter"
      [formControlName]="'beds'"
      [min]="1"
      [showButtons]="true"
      [fluid]="true"
    ></p-inputnumber>
  </div>
</form>
