<sctl-card [darkTheme]="true" [config]="{ title: 'PAGES.IMAGES.TITLE' | translate }">
  <p-tabs body [value]="currentTab" (valueChange)="onTabChange($event)">
    <p-tablist>
      <p-tab [value]="IMAGES_TABS.RESIDENCES">{{ 'PAGES.IMAGES.TABS.RESIDENCES' | translate }}</p-tab>
      <p-tab [value]="IMAGES_TABS.ROOMS">{{ 'PAGES.IMAGES.TABS.ROOMS' | translate }}</p-tab>
    </p-tablist>
  </p-tabs>
</sctl-card>

<div class="card mt-8">
  <p-dataview [value]="items()" [layout]="'list'">
    <ng-template #list let-items>
      <div class="flex flex-col">
        @for (item of items; track item.name; let index = $index) {
          <div class="flex flex-col sm:flex-row sm:items-center p-6 gap-12" [ngClass]="{ 'border-t border-surface': index !== 0 }">
            <div class="md:w-40 relative">
              <img class="block xl:block mx-auto rounded w-full" [src]="item.formatSrc" style="width: 150px; height: 150px; max-width: 150px; max-height: 150px;" />
            </div>
            <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
              <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                <div>
                  <span class="font-medium text-surface-500 dark:text-surface-400 text-sm">{{ item.type }}</span>
                  <div class="text-lg font-medium mt-2">{{ item.name }}</div>
                </div>
              </div>
              <div class="flex flex-col md:items-end gap-8">
                <div class="flex flex-row-reverse md:flex-row gap-2">
                  <p-button 
                    [icon]="'pi pi-images'" 
                    [label]="'PAGES.IMAGES.VIEW_IMAGES' | translate" 
                    [disabled]="item.viewDisabled"
                    styleClass="flex-auto md:flex-initial whitespace-nowrap"
                    (click)="onOpenImagesGalleria(item)"
                  ></p-button>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </ng-template>
  </p-dataview>
</div>

@if (showImagesGalleriaDialog()) {
  <sctl-images-galleria-dialog
    [visible]="showImagesGalleriaDialog()"
    [values]="imagesGalleriaIds()"
    [config]="imagesGalleriaDialogConfig()"
    (close)="showImagesGalleriaDialog.set(false)"
  ></sctl-images-galleria-dialog>
}
