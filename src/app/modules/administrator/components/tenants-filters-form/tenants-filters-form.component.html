<form class="contents" filtersForm [formGroup]="form">
  <div>
    <label for="tenants-name-filter" class="block text-surface-900 dark:text-surface-0 text-md font-medium mb-2">
      {{ 'TENANTS.COLS.NAME' | translate }}
    </label>
    <input pInputText class="w-full"
      id="tenants-name-filter"
      type="text"
      [formControlName]="'name'"
    />
  </div>
  <div>
    <label for="tenants-owner-filter" class="block text-surface-900 dark:text-surface-0 text-md font-medium mb-2">
      {{ 'TENANTS.COLS.OWNER' | translate }}
    </label>
    <p-select
      [appendTo]="'body'"
      [className]="'w-full'"
      [inputId]="'tenants-owner-filter'"
      [options]="userOptions" 
      formControlName="owner" 
      [optionLabel]="'name'"
      [optionValue]="'value'"
      class="w-full md:w-56" 
      [showClear]="true"
    />
  </div>
</form>
