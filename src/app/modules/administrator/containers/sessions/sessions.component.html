<sctl-crud
  [showTable]="showTable"
  [data]="crudValues"
  [state]="crudState"
  [config]="crudConfig" 
  (new)="undefined"
  (deleteMultiple)="onDeleteMultiple($event)"
  (selectAction)="onSelectAction($event)"
  (closeForm)="undefined"
  (pagination)="onPagination($event)"
  (clearFilters)="onClearFilters()"
  (searchFilters)="onSearchFilters()"
  (export)="onExportData()"
>
  <sctl-sessions-filters-form class="contents"
    filtersForm 
    #filtersForm
    (valueChange)="filtersValue=$event;"
  ></sctl-sessions-filters-form>
</sctl-crud>
