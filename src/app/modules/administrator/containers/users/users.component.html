<sctl-crud 
  [showTable]="showTable"
  [data]="crudValues"
  [state]="crudState"
  [config]="crudConfig" 
  (new)="onNew()"
  (deleteMultiple)="onDeleteMultiple($event)"
  (selectAction)="onSelectAction($event)"
  (closeForm)="onCloseFormDialog($event)"
  (pagination)="onPagination($event)"
  (clearFilters)="onClearFilters()"
  (searchFilters)="onSearchFilters()"
  (export)="onExportData()"
>
  <sctl-users-filters-form class="contents"
    filtersForm 
    #filtersForm
    (valueChange)="filtersValue=$event;"
  ></sctl-users-filters-form>

  @if (selectedItem) {
    <sctl-users-form form
      [value]="selectedItem"
      (valueChange)="selectedItem = $event;"
      (formValid)="formValid = $event;"
    ></sctl-users-form>
  }

  <ng-template [crudTemplate]="'avatar'" let-user let-col="col">
    <sctl-bucket-avatar
      [src]="getUserAvatarSrc(user)"
      [errorSrc]="'../../../../../assets/images/user-avatar.png'"
      [cssClass]="'w-[32px] h-[32px]'" 
      [canClick]="false" 
    ></sctl-bucket-avatar>
  </ng-template>
</sctl-crud>

@if (editPasswordVisible) {
  <sctl-edit-password-dialog 
    [visible]="editPasswordVisible" 
    [dialogConfig]="editPasswordConfig" 
    (close)="editPasswordVisible = false;"
    (formValid)="editPasswordFormValid = $event;"
    (submit)="onEditPassword($event)"
  ></sctl-edit-password-dialog>
}
