<div class="profile">
  <sctl-card [darkTheme]="darkTheme" [config]="{ title: 'PROFILE.TITLE' | translate }">
    <div body class="flex flex-col gap-4">

      <sctl-profile-header [user]="user"></sctl-profile-header>

      <p-tabs body [value]="currentTab" (valueChange)="onTabChange($event)">
          <p-tablist>
            <p-tab [value]="PROFILE_TABS.PERSONAL_INFORMATION">{{ 'PROFILE.TABS.PERSONAL_INFORMATION' | translate }}</p-tab>
            <p-tab [value]="PROFILE_TABS.CHANGE_PASSWORD">{{ 'PROFILE.TABS.CHANGE_PASSWORD' | translate }}</p-tab>
            <p-tab [value]="PROFILE_TABS.CONFIGURATION">{{ 'PROFILE.TABS.CONFIGURATION' | translate }}</p-tab>
          </p-tablist>
      </p-tabs>

      <sctl-card [darkTheme]="darkTheme" [config]="{ title: '', contrast: false, noPadding: true }">
        <ng-container body [ngTemplateOutlet]="currentTabTemplate"></ng-container>
        <ng-template #personalInformation>
          <sctl-profile-personal-information [user]="user"></sctl-profile-personal-information>
        </ng-template>
        <ng-template #changePassword>
          <sctl-profile-change-password [user]="user"></sctl-profile-change-password>
        </ng-template>
        <ng-template #configuration>
          <sctl-profile-configuration></sctl-profile-configuration>
        </ng-template>
      </sctl-card>

      <hr>

      @if (currentTab === PROFILE_TABS.PERSONAL_INFORMATION) {
        <div class="flex items-center justify-end">
          <p-button 
            [label]="'PROFILE.DELETE_ACCOUNT' | translate"
            severity="danger"
            icon="pi pi-exclamation-triangle" 
            (click)="onDeleteAccount()"
          ></p-button>
        </div>
      }
    </div>
  </sctl-card>
</div>
