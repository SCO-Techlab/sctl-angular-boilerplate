<sctl-auth-card [config]="cardConfig">
  <form [formGroup]="loginForm" body>
    <div class="mb-6">
      <label for="login-email" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
        {{inputs?.['email'].label}}
      </label>
      <input pInputText class="w-full md:w-120"
        id="login-email" 
        type="text"
        formControlName="email"
        [placeholder]="inputs?.['email'].placeholder"
      />
      <sctl-input-error [config]="formErrors?.['email']"></sctl-input-error>
    </div>

    <div class="mb-6">
      <label for="login-password" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">
        {{inputs?.['password'].label}}
      </label>
      <p-password
        id="login-password"
        formControlName="password"
        [placeholder]="inputs?.['password'].placeholder"
        [toggleMask]="true"
        [fluid]="true"
        [feedback]="false">
      </p-password>
      <sctl-input-error [config]="formErrors?.['password']"></sctl-input-error>
    </div>

    @if (!inputs?.['rememberMe'].disabled) {
      <div class="flex items-center justify-start mt-2 mb-6 gap-8">
        <div class="flex items-center">
          <p-checkbox binary class="mr-2" id="login-rememberme" formControlName="rememberMe"></p-checkbox>
          <label for="login-rememberme">{{inputs?.['rememberMe'].label}}</label>
        </div>
      </div>
    }

    <sctl-auth-links [config]="linksConfig"></sctl-auth-links>

    <p-button 
      [label]="'AUTH.LOGIN.BUTTON_LABEL' | translate"
      [disabled]="loginForm?.invalid"
      styleClass="w-full {{ linksConfig?.links?.length > 0 ? 'mt-4' : '' }}" 
      (click)="onClickButton()"
    ></p-button>
  </form>
</sctl-auth-card>
