<sctl-auth-card [config]="cardConfig">
  <form [formGroup]="forgotPasswordForm" body>
    <div class="mb-6">
      <label class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2" for="forgot-password-email">
        {{inputs?.['email'].label}}
      </label>
      <input class="w-full md:w-120"
        id="forgot-password-email"
        pInputText
        type="text"
        formControlName="email"
        [placeholder]="inputs?.['email'].placeholder"
      />
      <sctl-input-error [config]="formErrors?.['email']"></sctl-input-error>
    </div>

    @if (links?.length > 0) {
      <div class="flex flex-col items-center justify-center mt-2 mb-6 gap-8">
        @for(link of links; track link) {
          <span class="font-medium no-underline ml-2 text-right text-primary cursor-pointer" (click)="onClickLink(link.linkUrl)">
            {{link.linkLabel}}
          </span>
        }
      </div>
    }

    <p-button 
      [label]="'AUTH.FORGOT_PASSWORD.BUTTON_LABEL' | translate"
      [disabled]="forgotPasswordForm?.invalid"
      styleClass="w-full {{ links?.length > 0 ? 'mt-4' : '' }}" 
      (click)="onClickButton()"
    ></p-button>
  </form>
</sctl-auth-card>
