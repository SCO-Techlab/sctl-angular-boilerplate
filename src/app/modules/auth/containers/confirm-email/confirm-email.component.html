<sctl-auth-card [config]="cardConfig">
  <div body>
    <div class="mb-6 flex justify-center align-items-center">
      <p-message 
        [severity]="isError ? 'error' : 'success'" 
        variant="simple" 
        size="large"
      >
        <span>{{ resultMessage }}</span>
      </p-message>
    </div>
    <p-button 
      [label]="'AUTH.CONFIRM_EMAIL.BUTTON_LABEL' | translate"
      [disabled]="false"
      styleClass="w-full mt-4" 
      (click)="onClickButton()"
    ></p-button>
  </div>
</sctl-auth-card>
