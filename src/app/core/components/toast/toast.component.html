@if (messages?.length) {
  <div class="sctl-toast"
    [ngClass]="{
      'sctl-toast__top-right': getPosition() === TOAST_POSITION.TOP_RIGHT,
      'sctl-toast__top-left': getPosition() === TOAST_POSITION.TOP_LEFT,
      'sctl-toast__bottom-right': getPosition() === TOAST_POSITION.BOTTOM_RIGHT,
      'sctl-toast__bottom-left': getPosition() === TOAST_POSITION.BOTTOM_LEFT,
      'sctl-toast__block-top': getPosition() === TOAST_POSITION.TOP_CENTER,
      'sctl-toast__block-bottom': getPosition() === TOAST_POSITION.BOTTOM_CENTER
    }"
  >
    @for (msg of messages; track msg) {
      <div class="toast {{darkTheme() ? msg.severity + '-dark' : msg.severity + '-light'}}" [@toastAnim]>
        <div class="toast-content">
          @if (!msg.disableIcon) {
            <i class="toast-icon" [class]="getIcon(msg.severity)"></i>
          }

          <div class="toast-text">
            @if (msg.summary) {
            <div class="toast-summary">{{ msg.summary }}</div>
            }
            @if (msg.detail) {
            <div class="toast-detail">{{ msg.detail }}</div>
            }
          </div>

          @if (!msg.disableClose) {
            <button class="close-btn" (click)="close(msg.id!)">
              <i class="pi pi-times"></i>
            </button>
          }
        </div>
      </div>
    }
  </div>
}
