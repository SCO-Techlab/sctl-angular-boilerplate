<ul class="layout-menu">
  @for (item of menu(); track item; let i = $index) {
    <ng-container>
      @if (item.separator) {
        <li class="menu-separator"></li>
      } @else {
        <li sctl-layout-menu-item 
          [item]="item" 
          [index]="i" 
          [root]="true"
        ></li>
      }
    </ng-container>
  }
</ul>
